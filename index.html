<!DOCTYPE html>
<html>
<head>
    <title>Neon Snake Game</title>
    <style>
        body { background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        canvas { border: 5px solid #334155; background: #1e293b; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        h1 { color: #10b981; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>NEON SNAKE</h1>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let score = 0;
        let snake = [{x: 200, y: 200}, {x: 190, y: 200}, {x: 180, y: 200}];
        let dx = 10;
        let dy = 0;
        let foodX;
        let foodY;

        function createFood() {
            foodX = Math.floor(Math.random() * 39) * 10;
            foodY = Math.floor(Math.random() * 39) * 10;
        }

        function main() {
            if (didGameEnd()) {
                alert("Game Over! Score: " + score);
                location.reload();
                return;
            }
            setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, 100);
        }

        function clearCanvas() {
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, i) => {
                ctx.fillStyle = i === 0 ? "#10b981" : "#059669";
                ctx.fillRect(part.x, part.y, 10, 10);
            });
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            if (snake[0].x === foodX && snake[0].y === foodY) {
                score += 10;
                document.getElementById("score").innerHTML = "Score: " + score;
                createFood();
            } else {
                snake.pop();
            }
        }

        function didGameEnd() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return snake[0].x < 0 || snake[0].x > canvas.width - 10 || snake[0].y < 0 || snake[0].y > canvas.height - 10;
        }

        function drawFood() {
            ctx.fillStyle = "#f43f5e";
            ctx.fillRect(foodX, foodY, 10, 10);
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -10; }
            if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = 10; }
            if (e.key === "ArrowLeft" && dx === 0) { dx = -10; dy = 0; }
            if (e.key === "ArrowRight" && dx === 0) { dx = 10; dy = 0; }
        });

        createFood();
        main();
    </script>
</body>
</html>

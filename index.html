<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الإلهام</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-color: #00ffcc;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            transition: background 0.5s ease;
        }
        .container {
            text-align: center;
            padding: 40px;
            border: 2px solid var(--neon-color);
            border-radius: 20px;
            box-shadow: 0 0 20px var(--neon-color), inset 0 0 10px var(--neon-color);
            max-width: 80%;
            background: rgba(0, 0, 0, 0.8);
            position: relative;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-color);
            text-shadow: 0 0 10px var(--neon-color);
        }
        #quote {
            font-size: 1.8rem;
            margin-bottom: 30px;
            min-height: 100px;
            line-height: 1.4;
        }
        button {
            background: transparent;
            color: var(--neon-color);
            border: 2px solid var(--neon-color);
            padding: 10px 25px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        button:hover {
            background: var(--neon-color);
            color: #000;
            box-shadow: 0 0 30px var(--neon-color);
        }
        /* تصميم أيقونة الإنستغرام */
        .instagram-link {
            display: block;
            color: var(--neon-color);
            font-size: 2rem;
            text-decoration: none;
            transition: 0.3s;
            margin-top: 10px;
        }
        .instagram-link:hover {
            transform: scale(1.2);
            text-shadow: 0 0 15px var(--neon-color);
        }
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ جرعة إلهام</h1>
        <div id="quote">اضغط على الزر للحصول على حكمة اليوم..</div>
        <button onclick="generateQuote()">اقتباس جديد</button>
        
        <a href="https://www.instagram.com/MC__q" target="_blank" class="instagram-link">
            <i class="fa-brands fa-instagram"></i>
        </a>
    </div>

    <div class="footer">تم التطوير بواسطة Vercel & GitHub</div>

    <script>
        const quotes = [
            "لا تتوقف عندما تتعب، توقف عندما تنتهي.",
            "النجاح هو الانتقال من فشل إلى فشل دون فقدان الحماس.",
            "أفضل طريقة لتوقع المستقبل هي أن تخترعه.",
            "كل إنجاز عظيم بدأ بقرار أن تحاول.",
            "البساطة هي قمة الرقي.",
            "ما تركز عليه ينمو، وما تقاومه يستمر.",
            "الجمال في العقل وليس في الملامح.",
            "ابدأ حيث أنت، استخدم ما تملك، افعل ما تستطيع."
        ];

        const colors = ['#00ffcc', '#ff00ff', '#ffff00', '#007bff', '#ff4500', '#adff2f'];

        function generateQuote() {
            const quoteElement = document.getElementById('quote');
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            quoteElement.style.opacity = 0;
            setTimeout(() => {
                quoteElement.innerText = randomQuote;
                quoteElement.style.opacity = 1;
                document.documentElement.style.setProperty('--neon-color', randomColor);
            }, 200);
        }
    </script>
</body>
</html>
